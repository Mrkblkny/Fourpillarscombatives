name: Live Mobile + Desktop Browser Audit (read-only)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA runner
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify current source locally: scrolled mobile menu and idle assistant
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fpc-http-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          npx playwright test tests/local-menu.spec.mjs --reporter=line --workers=1
      - name: Check 10 live public pages and 3 training routes on mobile and desktop
        run: npx playwright test tests/public-browser-audit.spec.mjs --reporter=line --workers=2
      - name: Store browser failure screenshots for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fpc-public-browser-audit-failures
          path: test-results/
          retention-days: 7
