name: Audit website pages and navigation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/site.js
      - name: Audit all pages and links
        run: node tests/site-audit.mjs
