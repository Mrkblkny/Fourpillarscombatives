name: Audit website pages and navigation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check assets/site.js
      - name: Check visitor assistant and backend syntax
        run: |
          node --check assets/assistant.js
          node --check assets/assistant-knowledge.js
          node --check worker/index.js
      - name: Audit all pages and links
        run: node tests/site-audit.mjs
      - name: Test visitor assistant, AI guardrails, and public FAQs
        run: node tests/assistant-audit.mjs
